        .pastel-shadow { box-shadow: 0px 4px 20px rgba(88, 67, 107, 0.08); }
        .pastel-shadow-float { box-shadow: 0px 8px 30px rgba(88, 67, 107, 0.12), inset 0 0 0 1px rgba(64, 44, 83, 0.1); }

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center p-4">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-md rounded-xl pastel-shadow-float flex flex-col h-[795px] md:h-auto md:max-h-[850px] overflow-hidden relative">
<!-- Header -->
<header class="flex justify-between items-center px-lg py-md border-b border-surface-variant sticky top-0 bg-surface-container-lowest z-10">
<h1 class="font-headline-md text-headline-md text-primary">Registrar Movimiento</h1>
<button class="text-on-surface-variant hover:bg-surface-variant p-2 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Scrollable Content -->
<main class="flex-1 overflow-y-auto p-lg flex flex-col gap-xl">
<!-- Tipo de Movimiento -->
<section class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Tipo de Movimiento</label>
<div class="flex gap-sm p-1 bg-surface-container rounded-lg border border-surface-variant">
<button class="flex-1 py-2 px-4 rounded-md font-label-md text-label-md bg-surface-container-lowest text-primary shadow-sm transition-all text-center">
                        Ingreso
                    </button>
<button class="flex-1 py-2 px-4 rounded-md font-label-md text-label-md text-on-surface-variant hover:bg-surface-variant/50 transition-all text-center">
                        Retiro
                    </button>
</div>
</section>
<!-- Monto -->
<section class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Monto ($)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-headline-md text-headline-md text-primary">$</span>
<input class="w-full pl-12 pr-4 py-4 rounded-lg bg-surface border border-surface-variant text-right font-display-lg-mobile text-display-lg-mobile text-primary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant" placeholder="0.00" type="number"/>
</div>
</section>
<!-- Denominaciones Rápidas -->
<section class="grid grid-cols-3 gap-sm">
<button class="py-2 px-3 rounded-lg bg-surface border border-surface-variant font-label-md text-label-md text-on-surface hover:border-primary hover:text-primary transition-colors active:scale-95">+$100</button>
<button class="py-2 px-3 rounded-lg bg-surface border border-surface-variant font-label-md text-label-md text-on-surface hover:border-primary hover:text-primary transition-colors active:scale-95">+$200</button>
<button class="py-2 px-3 rounded-lg bg-surface border border-surface-variant font-label-md text-label-md text-on-surface hover:border-primary hover:text-primary transition-colors active:scale-95">+$500</button>
<button class="py-2 px-3 rounded-lg bg-surface border border-surface-variant font-label-md text-label-md text-on-surface hover:border-primary hover:text-primary transition-colors active:scale-95">+$1,000</button>
<button class="py-2 px-3 rounded-lg bg-surface border border-surface-variant font-label-md text-label-md text-on-surface hover:border-primary hover:text-primary transition-colors active:scale-95">+$2,000</button>
<button class="py-2 px-3 rounded-lg bg-surface-variant font-label-md text-label-md text-on-surface-variant hover:bg-outline-variant transition-colors active:scale-95 flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-sm">backspace</span>
</button>
</section>
<!-- Concepto -->
<section class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Concepto o Motivo</label>
<textarea class="w-full p-4 rounded-lg bg-surface border border-surface-variant font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant resize-none" placeholder="Ej. Pago a proveedor, fondo inicial..." rows="3"></textarea>
<div class="flex flex-wrap gap-2 mt-2">
<button class="px-3 py-1 rounded-full bg-surface-container text-on-primary-fixed-variant font-label-sm text-label-sm hover:bg-surface-variant transition-colors">Pago a Proveedor</button>
<button class="px-3 py-1 rounded-full bg-surface-container text-on-primary-fixed-variant font-label-sm text-label-sm hover:bg-surface-variant transition-colors">Fondo Inicial</button>
<button class="px-3 py-1 rounded-full bg-surface-container text-on-primary-fixed-variant font-label-sm text-label-sm hover:bg-surface-variant transition-colors">Gastos de Tienda</button>
</div>
</section>
</main>
<!-- Footer / Action -->
<footer class="p-lg border-t border-surface-variant bg-surface-container-lowest sticky bottom-0 z-10">
<button class="w-full py-4 rounded-lg bg-primary text-on-primary font-label-md text-label-md shadow-sm hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Registrar Movimiento
            </button>
</footer>
</div>
