<app-admin-shell menuId="admin-configuracion-menu" contentId="admin-configuracion-content" [activeSection]="'configuracion'">
  <div class="max-w-5xl mx-auto px-4 md:px-8 py-6 pb-24">
    <app-configuracion-tienda
      [sucursales]="sucursales"
      [sucursalActual]="sucursalActual"
      [cargando]="cargandoSucursal"
      (sucursalSeleccionada)="seleccionarSucursal($event)"
      (sucursalGuardada)="actualizarSucursal($event)"
    ></app-configuracion-tienda>
  </div>
</app-admin-shell>
