<app-modal-shell
  [isOpen]="isOpen"
  title="Registrar Nuevo Cliente"
  subtitle="Completa los datos para su cuenta de fiado y contacto"
  [size]="'md'"
  [backdropDismiss]="false"
  [showFooter]="true"
  closeButtonPosition="end"
  (closed)="onCancel()"
  (didPresent)="onModalPresented()"
>
  <div class="p-4 md:p-6 space-y-4">
    <section
      class="bg-surface-container-lowest rounded-[24px] p-5 shadow-sm border border-surface-variant/30 space-y-4"
    >
      <!-- Nombre(s) -->
      <div>
        <label
          for="cliente-nombre-input"
          class="block font-sans font-semibold text-xs text-on-surface-variant mb-1 ml-1 cursor-pointer select-none"
        >
          Nombre(s) *
        </label>
        <input
          #nombreInput
          id="cliente-nombre-input"
          type="text"
          placeholder="Ej: Doña Martha, Pedro, Carmen..."
          class="w-full bg-surface-container border border-outline-variant/30 rounded-xl py-3 px-4 font-sans text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all relative z-10 select-text"
          style="pointer-events: auto !important; -webkit-user-select: text !important; user-select: text !important"
          [class.border-error]="!!errorNombre"
          [(ngModel)]="form.nombreCliente"
          (input)="errorNombre = ''"
          (keydown.enter)="onSave()"
        />
        <p *ngIf="errorNombre" class="text-xs text-error mt-1 ml-1 font-sans">{{ errorNombre }}</p>
      </div>

      <!-- Apellido Paterno & Apellido Materno (2 cols) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block font-sans font-semibold text-xs text-on-surface-variant mb-1 ml-1">
            Apellido Paterno
          </label>
          <input
            type="text"
            placeholder="Ej: González"
            class="w-full bg-surface-container border border-outline-variant/30 rounded-xl py-3 px-4 font-sans text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all relative z-10 select-text"
            style="pointer-events: auto !important; -webkit-user-select: text !important; user-select: text !important"
            [(ngModel)]="form.apellidoPatCliente"
            (keydown.enter)="onSave()"
          />
        </div>
        <div>
          <label class="block font-sans font-semibold text-xs text-on-surface-variant mb-1 ml-1">
            Apellido Materno (opcional)
          </label>
          <input
            type="text"
            placeholder="Ej: Ramírez"
            class="w-full bg-surface-container border border-outline-variant/30 rounded-xl py-3 px-4 font-sans text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all relative z-10 select-text"
            style="pointer-events: auto !important; -webkit-user-select: text !important; user-select: text !important"
            [(ngModel)]="form.apellidoMatCliente"
            (keydown.enter)="onSave()"
          />
        </div>
      </div>

      <!-- Teléfono / WhatsApp & Correo (2 cols) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block font-sans font-semibold text-xs text-on-surface-variant mb-1 ml-1">
            Teléfono / WhatsApp * (10 dígitos)
          </label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">
              <span class="material-symbols-outlined text-base">call</span>
            </span>
            <input
              type="tel"
              maxlength="10"
              placeholder="7771234567"
              class="w-full bg-surface-container border border-outline-variant/30 rounded-xl py-3 pl-10 pr-4 font-sans text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all relative z-10 select-text"
              style="
                pointer-events: auto !important;
                -webkit-user-select: text !important;
                user-select: text !important;
              "
              [class.border-error]="!!errorTelefono"
              [(ngModel)]="form.telefono"
              (input)="errorTelefono = ''"
              (keydown.enter)="onSave()"
            />
          </div>
          <p *ngIf="errorTelefono" class="text-xs text-error mt-1 ml-1 font-sans">{{ errorTelefono }}</p>
        </div>

        <div>
          <label class="block font-sans font-semibold text-xs text-on-surface-variant mb-1 ml-1">
            Correo Electrónico (opcional)
          </label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">
              <span class="material-symbols-outlined text-base">mail</span>
            </span>
            <input
              type="email"
              placeholder="cliente@ejemplo.com"
              class="w-full bg-surface-container border border-outline-variant/30 rounded-xl py-3 pl-10 pr-4 font-sans text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all relative z-10 select-text"
              style="
                pointer-events: auto !important;
                -webkit-user-select: text !important;
                user-select: text !important;
              "
              [(ngModel)]="form.correoCliente"
              (keydown.enter)="onSave()"
            />
          </div>
        </div>
      </div>

      <!-- Límite de Crédito & Dirección (2 cols) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block font-sans font-semibold text-xs text-on-surface-variant mb-1 ml-1">
            Límite de Crédito ($ MXN)
          </label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 font-bold text-xs text-outline pointer-events-none"
              >$</span
            >
            <input
              type="number"
              min="0"
              step="50"
              placeholder="0.00 (sin límite si está vacío)"
              class="w-full bg-surface-container border border-outline-variant/30 rounded-xl py-3 pl-8 pr-4 font-sans text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all relative z-10 select-text"
              style="
                pointer-events: auto !important;
                -webkit-user-select: text !important;
                user-select: text !important;
              "
              [(ngModel)]="form.limiteCredito"
              (keydown.enter)="onSave()"
            />
          </div>
        </div>

        <div>
          <label class="block font-sans font-semibold text-xs text-on-surface-variant mb-1 ml-1">
            Dirección / Domicilio (opcional)
          </label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">
              <span class="material-symbols-outlined text-base">home</span>
            </span>
            <input
              type="text"
              placeholder="Calle, número, colonia..."
              class="w-full bg-surface-container border border-outline-variant/30 rounded-xl py-3 pl-10 pr-4 font-sans text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all relative z-10 select-text"
              style="
                pointer-events: auto !important;
                -webkit-user-select: text !important;
                user-select: text !important;
              "
              [(ngModel)]="form.direccion"
              (keydown.enter)="onSave()"
            />
          </div>
        </div>
      </div>

      <!-- Notas / Observaciones -->
      <div>
        <label class="block font-sans font-semibold text-xs text-on-surface-variant mb-1 ml-1">
          Notas / Referencias adicionales (opcional)
        </label>
        <textarea
          rows="2"
          placeholder="Referencias para ubicarlo, horario habitual, etc..."
          class="w-full bg-surface-container border border-outline-variant/30 rounded-xl py-2.5 px-4 font-sans text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all resize-none relative z-10 select-text"
          style="pointer-events: auto !important; -webkit-user-select: text !important; user-select: text !important"
          [(ngModel)]="form.notas"
        ></textarea>
      </div>
    </section>
  </div>

  <!-- Footer -->
  <div footer class="p-4 flex gap-3 w-full">
    <button
      type="button"
      class="flex-1 py-3 px-4 rounded-xl border border-outline-variant/30 font-sans font-medium text-sm text-on-surface-variant hover:bg-surface transition-all active:scale-95 cursor-pointer"
      (click)="onCancel()"
      [disabled]="saving"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="flex-1 bg-primary-container hover:bg-primary text-on-primary font-sans font-bold text-sm py-3.5 rounded-xl shadow-md transition-all active:scale-95 disabled:opacity-50 flex justify-center items-center gap-2 cursor-pointer"
      [disabled]="saving"
      (click)="onSave()"
    >
      <ion-spinner *ngIf="saving" name="crescent" class="w-4 h-4"></ion-spinner>
      {{ saving ? 'Guardando...' : 'Guardar y Seleccionar' }}
    </button>
  </div>
</app-modal-shell>
